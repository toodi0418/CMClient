name: Release Build Matrix

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      attest:
        description: Generate keyless Cosign and GitHub provenance attestations
        required: false
        default: false
        type: boolean
      channel:
        description: Update channel for an explicitly signed manifest
        required: false
        default: dev
        type: choice
        options: [stable, beta, dev]
      minimum_agent_version:
        description: Minimum Agent SemVer for an explicitly signed manifest
        required: false
        default: 2.0.0
        type: string
      release_base_url:
        description: Immutable HTTPS directory containing the finalized archives
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-plan:
    name: Verify artifact plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Generate canonical artifact plan
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-artifacts.mjs plan --version "$version" --output release-build/artifact-plan.json
          node scripts/release-artifacts.mjs check-plan --input release-build/artifact-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-release-artifact-plan
          path: release-build/artifact-plan.json
          if-no-files-found: error

  load-gate:
    name: Release load and resource gate
    needs: artifact-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - name: Install Agent native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libdbus-1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:load

  security-gate:
    name: Release dependency, secret, and policy gate
    needs: artifact-plan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit:policy
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level high
      - run: pnpm audit signatures
      - name: Install pinned security audit tools
        run: bash scripts/install-security-audit-tools.sh "$RUNNER_TEMP/cmclient-security-tools"
      - name: Validate GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/actionlint" .github/workflows/*.yml
      - name: Scan the repository for secrets
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/gitleaks" dir --redact --no-banner --no-color .
      - name: Audit Rust dependencies
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/cargo-audit" audit --deny unsound --ignore RUSTSEC-2024-0429

  build:
    name: ${{ matrix.component }} ${{ matrix.target }}
    needs: [artifact-plan, load-gate, security-gate]
    runs-on: ${{ matrix.os }}
    env:
      CMCLIENT_BUILD_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: desktop
            target: darwin-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - component: headless
            target: darwin-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - component: cli
            target: darwin-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - component: desktop
            target: darwin-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - component: headless
            target: darwin-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - component: cli
            target: darwin-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - component: desktop
            target: linux-aarch64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - component: headless
            target: linux-aarch64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - component: cli
            target: linux-aarch64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - component: desktop
            target: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - component: headless
            target: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - component: cli
            target: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - component: desktop
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - component: headless
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - component: cli
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - component: service
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - name: Install Linux desktop and secret-store dependencies
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            dbus-x11 \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            xdg-utils \
            xvfb
      - name: Install exact Rust target
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"
      - run: pnpm install --frozen-lockfile
      - name: Build production JavaScript inputs
        shell: bash
        run: |
          component="${{ matrix.component }}"
          rm -rf release-build-input
          if [ "$component" = "desktop" ]; then
            pnpm --filter @cmclient/desktop run build
          fi
          if [ "$component" != "cli" ]; then
            pnpm --filter @cmclient/contracts run build
            pnpm --filter @cmclient/gateway run build
            pnpm --filter @cmclient/web run build
            pnpm --config.node-linker=hoisted --filter @cmclient/gateway deploy \
              --prod --frozen-lockfile release-build-input/gateway
          fi
      - name: Build canonical Rust inputs
        shell: bash
        run: |
          packages=(--package cmclient-cli)
          case "${{ matrix.component }}" in
            headless) packages+=(--package cmclient-agent --package cmclient-legacy-migration) ;;
            desktop) packages+=(--package cmclient-agent --package cmclient-legacy-migration --package cmclient-desktop) ;;
            service) packages+=(--package cmclient-agent --package cmclient-legacy-migration --package cmclient-service-host) ;;
          esac
          cargo build --release --locked \
            "${packages[@]}" \
            --target "${{ matrix.rust_target }}"
      - name: Stage complete canonical composition
        id: stage
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          component="${{ matrix.component }}"
          target="${{ matrix.target }}"
          rust_output="target/${{ matrix.rust_target }}/release"
          executable_suffix=""
          if [[ "$target" == windows-* ]]; then
            executable_suffix=".exe"
          fi

          inputs=(--input "cli=$rust_output/cmclient$executable_suffix")
          if [ "$component" != "cli" ]; then
            inputs+=(
              --input "agent=$rust_output/cmclient-agent$executable_suffix"
              --input "migration=$rust_output/cmclient-migrate$executable_suffix"
              --input "gateway=release-build-input/gateway"
              --input "web=apps/web/dist"
              --input "proto=proto"
            )
            if [[ "$target" == linux-* ]]; then
              inputs+=(
                --input "systemdManager=scripts/cmclient-systemd.sh"
                --input "systemdUnit=packaging/systemd/cmclient-agent.service.in"
              )
            elif [[ "$target" == darwin-* ]]; then
              inputs+=(
                --input "launchdManager=scripts/cmclient-launchd.sh"
                --input "launchdPlist=packaging/launchd/io.cmclient.agent.plist.in"
              )
            fi
          fi
          if [ "$component" = "desktop" ]; then
            inputs+=(--input "desktop=$rust_output/cmclient-desktop$executable_suffix")
          elif [ "$component" = "service" ]; then
            inputs+=(
              --input "serviceHost=$rust_output/cmclient-service-host$executable_suffix"
              --input "windowsServiceManager=scripts/cmclient-windows-service.ps1"
            )
          fi

          node scripts/release-artifacts.mjs stage \
            --component "$component" \
            --target "${{ matrix.target }}" \
            --version "$version" \
            "${inputs[@]}" \
            --output release-build
          echo "artifact=cmclient-build-${{ matrix.component }}-${{ matrix.target }}-$version" >> "$GITHUB_OUTPUT"
      - name: Build native Desktop installers with the complete portable composition
        if: matrix.component == 'desktop'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          target="${{ matrix.target }}"
          rust_target="${{ matrix.rust_target }}"
          icon_output="$GITHUB_WORKSPACE/release-build-input/tauri-icons"
          config="$GITHUB_WORKSPACE/release-build-input/tauri-release.conf.json"
          rm -rf "$icon_output"
          pnpm --filter @cmclient/desktop exec tauri icon \
            "$GITHUB_WORKSPACE/apps/desktop/src-tauri/icons/icon.png" \
            --output "$icon_output"
          node scripts/desktop-native-bundles.mjs config \
            --target "$target" \
            --version "$version" \
            --portable "$GITHUB_WORKSPACE/release-build/desktop/$target" \
            --icons "$icon_output" \
            --output "$config"
          pnpm --filter @cmclient/desktop exec tauri bundle \
            --ci \
            --no-sign \
            --target "$rust_target" \
            --config "$config"
          node scripts/desktop-native-bundles.mjs collect \
            --target "$target" \
            --version "$version" \
            --bundle-root "target/$rust_target/release/bundle" \
            --output release-build
          node scripts/desktop-native-bundles.mjs verify-stage \
            --target "$target" \
            --version "$version" \
            --input "release-build/native-desktop/$target"
      - name: Smoke staged complete runtime composition
        if: matrix.component != 'cli'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          bash scripts/release-bundle-smoke.sh \
            "release-build/${{ matrix.component }}/${{ matrix.target }}" \
            "${{ matrix.target }}" \
            "$version" \
            "$GITHUB_SHA" \
            "${{ matrix.component }}"
      - name: Inspect native Desktop package resources
        if: matrix.component == 'desktop' && !startsWith(matrix.target, 'windows-')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          bash scripts/desktop-native-smoke.sh \
            "release-build/native-desktop/${{ matrix.target }}" \
            "${{ matrix.target }}" \
            "$version"
      - name: Inspect native Windows Desktop installer resources
        if: matrix.component == 'desktop' && startsWith(matrix.target, 'windows-')
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          & "$PWD/scripts/desktop-native-smoke.ps1" `
            -Stage "release-build/native-desktop/${{ matrix.target }}" `
            -Target "${{ matrix.target }}" `
            -Version $version
      - name: Smoke staged Windows Service archive lifecycle
        if: matrix.component == 'service'
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          $nodePath = (Get-Command node.exe -ErrorAction Stop).Source
          & "$PWD/scripts/release-windows-service-smoke.ps1" `
            -Bundle "release-build/service/windows-x86_64" `
            -Version $version `
            -Commit $env:GITHUB_SHA `
            -NodePath $nodePath
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: release-build/
          include-hidden-files: true
          if-no-files-found: error

  docker-composition:
    name: Docker Gateway, Web, and Ingress composition (${{ matrix.target }})
    needs: [artifact-plan, load-gate, security-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Verify Docker excludes host-control components
        run: node --test scripts/docker.test.mjs
      - name: Build and exercise the constrained Docker deployment
        run: bash scripts/docker-smoke.sh
      - name: Install OCI import tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Export source-bound, timestamp-normalized Docker OCI artifact
        id: docker-release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-dev.*) build_channel="dev" ;;
            *-*) build_channel="beta" ;;
            *) build_channel="stable" ;;
          esac
          source_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          created_at="$(date -u --date="@$source_epoch" '+%Y-%m-%dT%H:%M:%SZ')"
          archive="docker-build/cmclient.oci.tar"
          builder="cmclient-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.target }}"
          mkdir --parents docker-build
          docker buildx create \
            --driver docker-container \
            --name "$builder" \
            --use
          trap 'docker buildx rm --force "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --provenance=false \
            --sbom=false \
            --build-arg "SOURCE_DATE_EPOCH=$source_epoch" \
            --build-arg "CMCLIENT_BUILD_VERSION=$version" \
            --build-arg "CMCLIENT_BUILD_COMMIT=$GITHUB_SHA" \
            --build-arg "CMCLIENT_BUILD_CHANNEL=$build_channel" \
            --label "org.opencontainers.image.created=$created_at" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.title=cmclient" \
            --label "org.opencontainers.image.version=$version" \
            --tag "cmclient:$version-${{ matrix.target }}" \
            --output "type=oci,dest=$archive,rewrite-timestamp=true" \
            .
          node scripts/release-supply-chain.mjs stage-docker \
            --input "$archive" \
            --output docker-release \
            --source-sha "$GITHUB_SHA" \
            --target "${{ matrix.target }}" \
            --version "$version"
          release_image="cmclient:release-${{ matrix.target }}-$version"
          docker_archive="docker-build/cmclient.docker.tar"
          skopeo copy \
            --format v2s2 \
            "oci-archive:$archive" \
            "docker-archive:$docker_archive:$release_image"
          docker load --input "$docker_archive"
          docker image inspect "$release_image" >/dev/null
          CMCLIENT_IMAGE="$release_image" \
            CMCLIENT_SMOKE_PREBUILT=1 \
            CMCLIENT_EXPECTED_VERSION="$version" \
            CMCLIENT_EXPECTED_COMMIT="$GITHUB_SHA" \
            CMCLIENT_EXPECTED_CHANNEL="$build_channel" \
            bash scripts/docker-smoke.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-docker-oci-${{ matrix.target }}-${{ steps.docker-release.outputs.version }}
          path: docker-release/
          compression-level: 0
          if-no-files-found: error

  supply-chain:
    name: Assemble archives, checksums, and SBOM
    needs: [build, docker-composition]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-build-*
          path: release-build
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-docker-oci-*
          path: release-docker
          merge-multiple: true
      - name: Install deterministic archive tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            dbus-x11 \
            libayatana-appindicator3-1 \
            libwebkit2gtk-4.1-0 \
            libxdo3 \
            xvfb \
            zip \
            zstd
      - name: Assemble canonical release archives
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-supply-chain.mjs assemble \
            --input release-build \
            --output release-dist \
            --version "$version"
          node scripts/release-supply-chain.mjs include-docker \
            --input release-docker \
            --output release-dist \
            --source-sha "$GITHUB_SHA" \
            --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install checksum-pinned SBOM tool
        shell: bash
        run: bash scripts/install-sbom-tool.sh "$RUNNER_TEMP/cmclient-sbom-tools"
      - name: Generate staged-composition SBOM
        shell: bash
        run: |
          "$RUNNER_TEMP/cmclient-sbom-tools/syft" scan dir:release-build \
            --output "spdx-json=release-dist/cmclient-${{ steps.release.outputs.version }}.spdx.json"
      - name: Generate Docker OCI SBOMs
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          for target in linux-x86_64 linux-aarch64; do
            "$RUNNER_TEMP/cmclient-sbom-tools/syft" scan \
              "oci-archive:release-dist/cmclient-docker-$target-$version.oci.tar" \
              --output "spdx-json=release-dist/cmclient-docker-$target-$version.spdx.json"
          done
      - name: Finalize and verify supply-chain metadata
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          node scripts/release-supply-chain.mjs finalize --output release-dist
          node scripts/release-supply-chain.mjs verify \
            --output release-dist \
            --source-sha "$GITHUB_SHA" \
            --version "$version"
      - name: Smoke extracted final Headless archive
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          tar --zstd -xf \
            "release-dist/cmclient-headless-linux-x86_64-$version.tar.zst" \
            -C "$smoke_root"
          bash scripts/release-bundle-smoke.sh \
            "$smoke_root" \
            linux-x86_64 \
            "$version" \
            "$GITHUB_SHA"
      - name: Launch extracted final Desktop archive
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          tar --zstd -xf \
            "release-dist/cmclient-desktop-linux-x86_64-$version.tar.zst" \
            -C "$smoke_root"
          bash scripts/release-bundle-smoke.sh \
            "$smoke_root" \
            linux-x86_64 \
            "$version" \
            "$GITHUB_SHA" \
            desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-supply-chain-unsigned-${{ steps.release.outputs.version }}
          path: release-dist/
          if-no-files-found: error

  final-windows-service-smoke:
    name: Launch final Windows Service archive
    needs: supply-chain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-supply-chain-unsigned-*
          path: release-dist
          merge-multiple: true
      - name: Extract and launch the final service archive
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          $archive = "release-dist/cmclient-service-windows-x86_64-$version.zip"
          $fileName = Split-Path -Leaf $archive
          $checksumLine = Get-Content "release-dist/SHA256SUMS" |
            Where-Object { $_ -match "^[a-f0-9]{64} \*$([regex]::Escape($fileName))$" } |
            Select-Object -First 1
          if ($null -eq $checksumLine) { throw "Final service checksum is missing" }
          $expectedChecksum = $checksumLine.Substring(0, 64)
          $actualChecksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualChecksum -ne $expectedChecksum) { throw "Final service checksum is invalid" }
          $bundle = Join-Path $env:RUNNER_TEMP "cmclient-final-service"
          Expand-Archive -LiteralPath $archive -DestinationPath $bundle
          $nodePath = (Get-Command node.exe -ErrorAction Stop).Source
          & "$PWD/scripts/release-windows-service-smoke.ps1" `
            -Bundle $bundle `
            -Version $version `
            -Commit $env:GITHUB_SHA `
            -NodePath $nodePath

  attest:
    name: Sign checksums and publish provenance
    needs: [supply-chain, final-windows-service-smoke]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Verify the exact immutable release tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || {
            echo "RELEASE_TAG_VERSION_MISMATCH" >&2
            exit 1
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-supply-chain-unsigned-*
          path: release-dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Create keyless checksum signature bundle
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle release-dist/SHA256SUMS.sigstore.json \
            release-dist/SHA256SUMS
      - name: Attest archive and SBOM checksums
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: release-dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-supply-chain-attested
          path: release-dist/
          if-no-files-found: error

  sign-update-manifest:
    name: Sign Agent update manifest
    needs: [supply-chain, attest]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest &&
      inputs.release_base_url != '' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-supply-chain-attested
          path: release-dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Verify immutable tag, release input, and attestation before exposing the signing key
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || {
            echo "RELEASE_TAG_VERSION_MISMATCH" >&2
            exit 1
          }
          node scripts/release-supply-chain.mjs verify \
            --output release-dist \
            --source-sha "$GITHUB_SHA" \
            --version "$version"
          cosign verify-blob \
            --bundle release-dist/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-build.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-dist/SHA256SUMS
      - name: Sign canonical Agent manifest without exposing the private key
        shell: bash
        env:
          CMCLIENT_UPDATE_SIGNING_KEY: ${{ secrets.CMCLIENT_UPDATE_SIGNING_KEY }}
          RELEASE_BASE_URL: ${{ inputs.release_base_url }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_MINIMUM_AGENT_VERSION: ${{ inputs.minimum_agent_version }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.CMCLIENT_UPDATE_SIGNING_KEY_ID }}
        run: |
          [[ -n "$CMCLIENT_UPDATE_SIGNING_KEY" ]] || {
            echo "RELEASE_SIGNING_KEY_MISSING" >&2
            exit 1
          }
          [[ -n "$RELEASE_SIGNING_KEY_ID" ]] || {
            echo "RELEASE_SIGNING_KEY_ID_MISSING" >&2
            exit 1
          }
          published_at="$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)"
          node scripts/release-supply-chain.mjs sign-update-manifest \
            --index release-dist/release-index.json \
            --output release-dist/update-manifest.json \
            --channel "$RELEASE_CHANNEL" \
            --minimum-agent-version "$RELEASE_MINIMUM_AGENT_VERSION" \
            --published-at "$published_at" \
            --release-base-url "$RELEASE_BASE_URL" \
            --signing-key-id "$RELEASE_SIGNING_KEY_ID" \
            --private-key-env CMCLIENT_UPDATE_SIGNING_KEY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-signed-update-manifest
          path: release-dist/update-manifest.json
          if-no-files-found: error
