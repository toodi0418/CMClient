[package]
name = "cmclient-agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10.1"
cmclient-runtime-primitives = { path = "../runtime-primitives" }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
rustls = "0.23"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
