[package]
name = "cmclient-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cmclient-runtime-logging = { path = "../runtime-logging" }
hmac = "0.12"
process-wrap = { version = "9.1.0", default-features = false, features = ["std", "job-object", "process-group"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.22", features = ["v4"] }
