name: Release Build Matrix

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      attest:
        description: Generate keyless Cosign and GitHub provenance attestations
        required: false
        default: false
        type: boolean
      channel:
        description: Update channel for an explicitly signed manifest
        required: false
        default: dev
        type: choice
        options: [stable, candidate, dev]
      minimum_agent_version:
        description: Minimum Agent SemVer for an explicitly signed manifest
        required: false
        default: 2.0.0
        type: string
      release_base_url:
        description: Immutable HTTPS directory containing the finalized archives
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-plan:
    name: Verify artifact plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Generate canonical artifact plan
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-artifacts.mjs plan --version "$version" --output release-build/artifact-plan.json
          node scripts/release-artifacts.mjs check-plan --input release-build/artifact-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-release-artifact-plan
          path: release-build/artifact-plan.json
          if-no-files-found: error

  load-gate:
    name: Release load and resource gate
    needs: artifact-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - name: Install Agent native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libdbus-1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:load

  security-gate:
    name: Release dependency, secret, and policy gate
    needs: artifact-plan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit:policy
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level high
      - run: pnpm audit signatures
      - name: Install pinned security audit tools
        run: bash scripts/install-security-audit-tools.sh "$RUNNER_TEMP/cmclient-security-tools"
      - name: Validate GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/actionlint" .github/workflows/*.yml
      - name: Scan the repository for secrets
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/gitleaks" dir --redact --no-banner --no-color .
      - name: Audit Rust dependencies
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/cargo-audit" audit --deny unsound --ignore RUSTSEC-2024-0429

  build:
    name: ${{ matrix.component }} ${{ matrix.target }}
    needs: [artifact-plan, load-gate, security-gate]
    runs-on: ${{ matrix.os }}
    env:
      CMCLIENT_BUILD_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: desktop
            target: darwin-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - component: headless
            target: darwin-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - component: cli
            target: darwin-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - component: desktop
            target: darwin-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - component: headless
            target: darwin-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - component: cli
            target: darwin-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - component: desktop
            target: linux-aarch64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - component: headless
            target: linux-aarch64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - component: cli
            target: linux-aarch64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - component: desktop
            target: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - component: headless
            target: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - component: cli
            target: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - component: desktop
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - component: headless
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - component: cli
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - component: service
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - name: Install Linux desktop and secret-store dependencies
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            dbus-x11 \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            xdg-utils \
            xvfb
      - name: Install exact Rust target
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"
      - run: pnpm install --frozen-lockfile
      - name: Build production JavaScript inputs
        shell: bash
        run: |
          component="${{ matrix.component }}"
          rm -rf release-build-input
          if [ "$component" = "desktop" ]; then
            pnpm --filter @cmclient/desktop run build
          fi
          if [ "$component" != "cli" ]; then
            pnpm --filter @cmclient/contracts run build
            pnpm --filter @cmclient/gateway run build
            pnpm --filter @cmclient/web run build
            pnpm --config.node-linker=hoisted --filter @cmclient/gateway deploy \
              --prod --frozen-lockfile release-build-input/gateway
          fi
      - name: Build canonical Rust inputs
        shell: bash
        run: |
          packages=(--package cmclient-cli)
          case "${{ matrix.component }}" in
            headless) packages+=(--package cmclient-agent --package cmclient-legacy-migration) ;;
            desktop) packages+=(--package cmclient-agent --package cmclient-legacy-migration --package cmclient-desktop) ;;
            service) packages+=(--package cmclient-agent --package cmclient-legacy-migration --package cmclient-service-host) ;;
          esac
          cargo build --release --locked \
            "${packages[@]}" \
            --target "${{ matrix.rust_target }}"
      - name: Stage complete canonical composition
        id: stage
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          component="${{ matrix.component }}"
          target="${{ matrix.target }}"
          rust_output="target/${{ matrix.rust_target }}/release"
          executable_suffix=""
          if [[ "$target" == windows-* ]]; then
            executable_suffix=".exe"
          fi

          inputs=(--input "cli=$rust_output/cmclient$executable_suffix")
          if [ "$component" != "cli" ]; then
            inputs+=(
              --input "agent=$rust_output/cmclient-agent$executable_suffix"
              --input "migration=$rust_output/cmclient-migrate$executable_suffix"
              --input "gateway=release-build-input/gateway"
              --input "web=apps/web/dist"
              --input "proto=proto"
            )
            if [[ "$target" == linux-* ]]; then
              inputs+=(
                --input "systemdManager=scripts/cmclient-systemd.sh"
                --input "systemdUnit=packaging/systemd/cmclient-agent.service.in"
              )
            elif [[ "$target" == darwin-* ]]; then
              inputs+=(
                --input "launchdManager=scripts/cmclient-launchd.sh"
                --input "launchdPlist=packaging/launchd/io.cmclient.agent.plist.in"
              )
            fi
          fi
          if [ "$component" = "desktop" ]; then
            inputs+=(--input "desktop=$rust_output/cmclient-desktop$executable_suffix")
          elif [ "$component" = "service" ]; then
            inputs+=(
              --input "serviceHost=$rust_output/cmclient-service-host$executable_suffix"
              --input "windowsServiceManager=scripts/cmclient-windows-service.ps1"
            )
          fi

          node scripts/release-artifacts.mjs stage \
            --component "$component" \
            --target "${{ matrix.target }}" \
            --version "$version" \
            "${inputs[@]}" \
            --output release-build
          echo "artifact=cmclient-build-${{ matrix.component }}-${{ matrix.target }}-$version" >> "$GITHUB_OUTPUT"
      - name: Build native Desktop installers with the complete portable composition
        if: matrix.component == 'desktop'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          target="${{ matrix.target }}"
          rust_target="${{ matrix.rust_target }}"
          icon_output="$GITHUB_WORKSPACE/release-build-input/tauri-icons"
          config="$GITHUB_WORKSPACE/release-build-input/tauri-release.conf.json"
          rm -rf "$icon_output"
          pnpm --filter @cmclient/desktop exec tauri icon \
            "$GITHUB_WORKSPACE/apps/desktop/src-tauri/icons/icon.png" \
            --output "$icon_output"
          node scripts/desktop-native-bundles.mjs config \
            --target "$target" \
            --version "$version" \
            --portable "$GITHUB_WORKSPACE/release-build/desktop/$target" \
            --icons "$icon_output" \
            --output "$config"
          bundle_args=(
            --ci
            --no-sign
            --target "$rust_target"
            --config "$config"
          )
          if [[ "$target" == linux-* ]]; then
            # linuxdeploy scans the complete portable runtime. Do not let its
            # strip pass reject static ELF helpers shipped as runtime data.
            export NO_STRIP=true
            bundle_args+=(--verbose)
          fi
          pnpm --filter @cmclient/desktop exec tauri bundle "${bundle_args[@]}"
          node scripts/desktop-native-bundles.mjs collect \
            --target "$target" \
            --version "$version" \
            --bundle-root "target/$rust_target/release/bundle" \
            --output release-build
          node scripts/desktop-native-bundles.mjs verify-stage \
            --target "$target" \
            --version "$version" \
            --input "release-build/native-desktop/$target"
      - name: Smoke staged complete runtime composition
        if: matrix.component != 'cli'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          bash scripts/release-bundle-smoke.sh \
            "release-build/${{ matrix.component }}/${{ matrix.target }}" \
            "${{ matrix.target }}" \
            "$version" \
            "$GITHUB_SHA" \
            "${{ matrix.component }}"
      - name: Inspect native Desktop package resources
        if: matrix.component == 'desktop' && !startsWith(matrix.target, 'windows-')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          bash scripts/desktop-native-smoke.sh \
            "release-build/native-desktop/${{ matrix.target }}" \
            "${{ matrix.target }}" \
            "$version"
      - name: Inspect native Windows Desktop installer resources
        if: matrix.component == 'desktop' && startsWith(matrix.target, 'windows-')
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          & "$PWD/scripts/desktop-native-smoke.ps1" `
            -Stage "release-build/native-desktop/${{ matrix.target }}" `
            -Target "${{ matrix.target }}" `
            -Version $version
      - name: Smoke staged Windows Service archive lifecycle
        if: matrix.component == 'service'
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          $nodePath = (Get-Command node.exe -ErrorAction Stop).Source
          & "$PWD/scripts/release-windows-service-smoke.ps1" `
            -Bundle "release-build/service/windows-x86_64" `
            -Version $version `
            -Commit $env:GITHUB_SHA `
            -NodePath $nodePath
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: release-build/
          include-hidden-files: true
          if-no-files-found: error

  docker-composition:
    name: Docker Gateway, Web, and Ingress composition (${{ matrix.target }})
    needs: [artifact-plan, load-gate, security-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Verify Docker excludes host-control components
        run: node --test scripts/docker.test.mjs
      - name: Build and exercise the constrained Docker deployment
        run: bash scripts/docker-smoke.sh
      - name: Install OCI import tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Export source-bound, timestamp-normalized Docker OCI artifact
        id: docker-release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-dev.*) build_channel="dev" ;;
            *-*) build_channel="candidate" ;;
            *) build_channel="stable" ;;
          esac
          source_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          target_architecture="${{ matrix.target }}"
          target_architecture="${target_architecture#linux-}"
          created_at="$(date -u --date="@$source_epoch" '+%Y-%m-%dT%H:%M:%SZ')"
          archive="docker-build/cmclient.oci.tar"
          builder="cmclient-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.target }}"
          mkdir --parents docker-build
          docker buildx create \
            --driver docker-container \
            --name "$builder" \
            --use
          trap 'docker buildx rm --force "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --provenance=false \
            --sbom=false \
            --build-arg "SOURCE_DATE_EPOCH=$source_epoch" \
            --build-arg "CMCLIENT_BUILD_VERSION=$version" \
            --build-arg "CMCLIENT_BUILD_COMMIT=$GITHUB_SHA" \
            --build-arg "CMCLIENT_BUILD_TREE=$source_tree" \
            --build-arg "CMCLIENT_BUILD_CHANNEL=$build_channel" \
            --build-arg "CMCLIENT_TARGET_ARCHITECTURE=$target_architecture" \
            --label "org.opencontainers.image.created=$created_at" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.title=cmclient" \
            --label "org.opencontainers.image.version=$version" \
            --tag "cmclient:$version-${{ matrix.target }}" \
            --output "type=oci,dest=$archive,rewrite-timestamp=true" \
            .
          node scripts/release-supply-chain.mjs stage-docker \
            --input "$archive" \
            --output docker-release \
            --source-sha "$GITHUB_SHA" \
            --target "${{ matrix.target }}" \
            --version "$version"
          release_image="cmclient:release-${{ matrix.target }}-$version"
          docker_archive="docker-build/cmclient.docker.tar"
          skopeo copy \
            --format v2s2 \
            "oci-archive:$archive" \
            "docker-archive:$docker_archive:$release_image"
          docker load --input "$docker_archive"
          docker image inspect "$release_image" >/dev/null
          CMCLIENT_IMAGE="$release_image" \
            CMCLIENT_SMOKE_PREBUILT=1 \
            CMCLIENT_EXPECTED_VERSION="$version" \
            CMCLIENT_EXPECTED_COMMIT="$GITHUB_SHA" \
            CMCLIENT_EXPECTED_CHANNEL="$build_channel" \
            bash scripts/docker-smoke.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-docker-oci-${{ matrix.target }}-${{ steps.docker-release.outputs.version }}
          path: docker-release/
          compression-level: 0
          if-no-files-found: error

  supply-chain:
    name: Assemble archives, checksums, and SBOM
    needs: [build, docker-composition]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-build-*
          path: release-build
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-docker-oci-*
          path: release-docker
          merge-multiple: true
      - name: Install deterministic archive tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            dbus-x11 \
            libayatana-appindicator3-1 \
            libwebkit2gtk-4.1-0 \
            libxdo3 \
            xvfb \
            zip \
            zstd
      - name: Assemble canonical release archives
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-supply-chain.mjs assemble \
            --input release-build \
            --output release-dist \
            --version "$version"
          node scripts/release-supply-chain.mjs include-docker \
            --compose docker-compose.yml \
            --input release-docker \
            --output release-dist \
            --source-sha "$GITHUB_SHA" \
            --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate released Docker Compose descriptor
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          CMCLIENT_IMAGE="cmclient:$version" docker compose \
            --file "release-dist/cmclient-docker-compose-$version.yml" \
            config --quiet
      - name: Install checksum-pinned SBOM tool
        shell: bash
        run: bash scripts/install-sbom-tool.sh "$RUNNER_TEMP/cmclient-sbom-tools"
      - name: Generate staged-composition SBOM
        shell: bash
        run: |
          "$RUNNER_TEMP/cmclient-sbom-tools/syft" scan dir:release-build \
            --output "spdx-json=release-dist/cmclient-${{ steps.release.outputs.version }}.spdx.json"
      - name: Generate Docker OCI SBOMs
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          for target in linux-x86_64 linux-aarch64; do
            "$RUNNER_TEMP/cmclient-sbom-tools/syft" scan \
              "oci-archive:release-dist/cmclient-docker-$target-$version.oci.tar" \
              --output "spdx-json=release-dist/cmclient-docker-$target-$version.spdx.json"
          done
      - name: Finalize and verify supply-chain metadata
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          node scripts/release-supply-chain.mjs finalize --output release-dist
          node scripts/release-supply-chain.mjs verify \
            --output release-dist \
            --source-sha "$GITHUB_SHA" \
            --version "$version"
      - name: Smoke extracted final Headless archive
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          tar --zstd -xf \
            "release-dist/cmclient-headless-linux-x86_64-$version.tar.zst" \
            -C "$smoke_root"
          bash scripts/release-bundle-smoke.sh \
            "$smoke_root" \
            linux-x86_64 \
            "$version" \
            "$GITHUB_SHA"
      - name: Launch extracted final Desktop archive
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          tar --zstd -xf \
            "release-dist/cmclient-desktop-linux-x86_64-$version.tar.zst" \
            -C "$smoke_root"
          bash scripts/release-bundle-smoke.sh \
            "$smoke_root" \
            linux-x86_64 \
            "$version" \
            "$GITHUB_SHA" \
            desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-supply-chain-unsigned-${{ steps.release.outputs.version }}
          path: release-dist/
          if-no-files-found: error

  final-windows-service-smoke:
    name: Launch final Windows Service archive
    needs: supply-chain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-supply-chain-unsigned-*
          path: release-dist
          merge-multiple: true
      - name: Extract and launch the final service archive
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          $archive = "release-dist/cmclient-service-windows-x86_64-$version.zip"
          $fileName = Split-Path -Leaf $archive
          $checksumLine = Get-Content "release-dist/SHA256SUMS" |
            Where-Object { $_ -match "^[a-f0-9]{64} \*$([regex]::Escape($fileName))$" } |
            Select-Object -First 1
          if ($null -eq $checksumLine) { throw "Final service checksum is missing" }
          $expectedChecksum = $checksumLine.Substring(0, 64)
          $actualChecksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualChecksum -ne $expectedChecksum) { throw "Final service checksum is invalid" }
          $bundle = Join-Path $env:RUNNER_TEMP "cmclient-final-service"
          Expand-Archive -LiteralPath $archive -DestinationPath $bundle
          $nodePath = (Get-Command node.exe -ErrorAction Stop).Source
          & "$PWD/scripts/release-windows-service-smoke.ps1" `
            -Bundle $bundle `
            -Version $version `
            -Commit $env:GITHUB_SHA `
            -NodePath $nodePath

  platform-sign-native:
    name: Platform-sign native Desktop (${{ matrix.target }})
    needs: [build, supply-chain, final-windows-service-smoke]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    environment: production-release
    env:
      CMCLIENT_APPLE_API_ISSUER: ${{ vars.CMCLIENT_APPLE_API_ISSUER }}
      CMCLIENT_APPLE_API_KEY_ID: ${{ vars.CMCLIENT_APPLE_API_KEY_ID }}
      CMCLIENT_APPLE_SIGNING_IDENTITY: ${{ vars.CMCLIENT_APPLE_SIGNING_IDENTITY }}
      CMCLIENT_LINUX_SIGNING_KEY_ID: ${{ vars.CMCLIENT_LINUX_SIGNING_KEY_ID }}
      CMCLIENT_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.CMCLIENT_WINDOWS_CERTIFICATE_THUMBPRINT }}
      CMCLIENT_WINDOWS_TIMESTAMP_URL: ${{ vars.CMCLIENT_WINDOWS_TIMESTAMP_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - target: darwin-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - target: linux-aarch64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Verify exact tag and non-secret signing identity
        id: identity
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || {
            echo "RELEASE_TAG_VERSION_MISMATCH" >&2
            exit 1
          }
          case "${{ matrix.target }}" in
            darwin-*)
              [[ "$CMCLIENT_APPLE_API_ISSUER" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ &&
                 "$CMCLIENT_APPLE_API_KEY_ID" =~ ^[A-Za-z0-9]{10}$ ]] || {
                echo "RELEASE_APPLE_NOTARIZATION_IDENTITY_INVALID" >&2
                exit 1
              }
              identity="$CMCLIENT_APPLE_SIGNING_IDENTITY"
              ;;
            linux-*)
              [[ "$CMCLIENT_LINUX_SIGNING_KEY_ID" =~ ^[A-Fa-f0-9]{40}$ ]] || {
                echo "RELEASE_LINUX_SIGNING_IDENTITY_INVALID" >&2
                exit 1
              }
              identity="${CMCLIENT_LINUX_SIGNING_KEY_ID^^}"
              ;;
            windows-*)
              [[ "$CMCLIENT_WINDOWS_CERTIFICATE_THUMBPRINT" =~ ^[A-Fa-f0-9]{40}$ ]] || {
                echo "RELEASE_WINDOWS_SIGNING_IDENTITY_INVALID" >&2
                exit 1
              }
              identity="${CMCLIENT_WINDOWS_CERTIFICATE_THUMBPRINT^^}"
              ;;
            *) echo "RELEASE_PLATFORM_SIGNING_TARGET_INVALID" >&2; exit 1 ;;
          esac
          [[ -n "$identity" && ${#identity} -le 256 &&
             "$identity" != *$'\n'* && "$identity" != *$'\r'* ]] || {
            echo "RELEASE_PLATFORM_SIGNING_IDENTITY_MISSING" >&2
            exit 1
          }
          IDENTITY_REFERENCE="$identity" node -e '
            const value = process.env.IDENTITY_REFERENCE;
            if (value.trim() !== value || [...value].some((character) => {
              const code = character.codePointAt(0);
              return code < 0x20 || code === 0x7f;
            })) {
              process.stderr.write("RELEASE_PLATFORM_SIGNING_IDENTITY_INVALID\n");
              process.exit(1);
            }
          '
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "identity_reference=$identity" >> "$GITHUB_OUTPUT"
      - name: Install Linux native bundle dependencies
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            xdg-utils
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-build-desktop-${{ matrix.target }}-${{ steps.identity.outputs.version }}
          path: release-build
          merge-multiple: true
      - name: Prepare exact prebuilt Desktop binary and signing config
        shell: bash
        run: |
          target="${{ matrix.target }}"
          rust_target="${{ matrix.rust_target }}"
          version="${{ steps.identity.outputs.version }}"
          executable_suffix=""
          if [[ "$target" == windows-* ]]; then executable_suffix=".exe"; fi
          node scripts/desktop-native-bundles.mjs verify-stage \
            --target "$target" \
            --version "$version" \
            --input "release-build/native-desktop/$target"
          mkdir -p "target/$rust_target/release"
          cp \
            "release-build/desktop/$target/bin/cmclient-desktop$executable_suffix" \
            "target/$rust_target/release/cmclient-desktop$executable_suffix"
          if [[ "$target" != windows-* ]]; then
            chmod 755 "target/$rust_target/release/cmclient-desktop"
          fi
          icon_output="$RUNNER_TEMP/tauri-icons"
          config="$RUNNER_TEMP/tauri-platform-signed.json"
          pnpm --filter @cmclient/desktop exec tauri icon \
            "$GITHUB_WORKSPACE/apps/desktop/src-tauri/icons/icon.png" \
            --output "$icon_output"
          config_args=(
            --target "$target"
            --version "$version"
            --portable "$GITHUB_WORKSPACE/release-build/desktop/$target"
            --icons "$icon_output"
            --output "$config"
          )
          if [[ "$target" == windows-* ]]; then
            config_args+=(
              --windows-certificate-thumbprint "$CMCLIENT_WINDOWS_CERTIFICATE_THUMBPRINT"
              --windows-timestamp-url "$CMCLIENT_WINDOWS_TIMESTAMP_URL"
            )
          fi
          node scripts/desktop-native-bundles.mjs config "${config_args[@]}"
          echo "CMCLIENT_PLATFORM_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Import Apple certificate and notarization key
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          CMCLIENT_APPLE_API_KEY_PRIVATE: ${{ secrets.CMCLIENT_APPLE_API_KEY_PRIVATE }}
          CMCLIENT_APPLE_CERTIFICATE: ${{ secrets.CMCLIENT_APPLE_CERTIFICATE }}
          CMCLIENT_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CMCLIENT_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$CMCLIENT_APPLE_CERTIFICATE" && \
             -n "$CMCLIENT_APPLE_CERTIFICATE_PASSWORD" && \
             -n "$CMCLIENT_APPLE_API_KEY_PRIVATE" && \
             -n "$CMCLIENT_APPLE_API_ISSUER" && \
             -n "$CMCLIENT_APPLE_API_KEY_ID" ]] || {
            echo "RELEASE_APPLE_SIGNING_CREDENTIAL_MISSING" >&2
            exit 1
          }
          umask 077
          certificate="$RUNNER_TEMP/cmclient-apple-certificate.p12"
          api_key="$RUNNER_TEMP/AuthKey_$CMCLIENT_APPLE_API_KEY_ID.p8"
          keychain="$RUNNER_TEMP/cmclient-signing.keychain-db"
          node -e \
            'require("node:fs").writeFileSync(process.argv[1], Buffer.from(process.env.CMCLIENT_APPLE_CERTIFICATE, "base64"))' \
            "$certificate"
          printf '%s' "$CMCLIENT_APPLE_API_KEY_PRIVATE" > "$api_key"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CMCLIENT_APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          echo "APPLE_API_KEY_PATH=$api_key" >> "$GITHUB_ENV"
          echo "CMCLIENT_APPLE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Import Windows Authenticode certificate
        if: startsWith(matrix.target, 'windows-')
        shell: powershell
        env:
          CMCLIENT_WINDOWS_CERTIFICATE: ${{ secrets.CMCLIENT_WINDOWS_CERTIFICATE }}
          CMCLIENT_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.CMCLIENT_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CMCLIENT_WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:CMCLIENT_WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "RELEASE_WINDOWS_SIGNING_CREDENTIAL_MISSING"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cmclient-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:CMCLIENT_WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            $env:CMCLIENT_WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          $certificates = @(Import-PfxCertificate `
            -FilePath $pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password)
          $expected = $env:CMCLIENT_WINDOWS_CERTIFICATE_THUMBPRINT.ToUpperInvariant()
          $matching = @($certificates | Where-Object {
            $_.HasPrivateKey -and $_.Thumbprint.ToUpperInvariant() -eq $expected
          })
          if ($matching.Count -ne 1) {
            throw "RELEASE_WINDOWS_SIGNING_IDENTITY_MISMATCH"
          }
          "CMCLIENT_IMPORTED_CERT_THUMBPRINT=$expected" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import Linux AppImage signing key
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        env:
          CMCLIENT_LINUX_SIGNING_KEY: ${{ secrets.CMCLIENT_LINUX_SIGNING_KEY }}
        run: |
          [[ -n "$CMCLIENT_LINUX_SIGNING_KEY" ]] || {
            echo "RELEASE_LINUX_SIGNING_KEY_MISSING" >&2
            exit 1
          }
          export GNUPGHOME="$RUNNER_TEMP/cmclient-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$CMCLIENT_LINUX_SIGNING_KEY" | \
            base64 --decode | \
            gpg --batch --import
          gpg --batch --list-secret-keys "$CMCLIENT_LINUX_SIGNING_KEY_ID" >/dev/null
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Bundle and notarize macOS Desktop
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ vars.CMCLIENT_APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.CMCLIENT_APPLE_API_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.CMCLIENT_APPLE_SIGNING_IDENTITY }}
        run: |
          pnpm --filter @cmclient/desktop exec tauri bundle \
            --ci \
            --target "${{ matrix.rust_target }}" \
            --config "$CMCLIENT_PLATFORM_CONFIG"
      - name: Bundle Authenticode-signed Windows Desktop
        if: startsWith(matrix.target, 'windows-')
        shell: bash
        run: |
          pnpm --filter @cmclient/desktop exec tauri bundle \
            --ci \
            --target "${{ matrix.rust_target }}" \
            --config "$CMCLIENT_PLATFORM_CONFIG"
      - name: Bundle GPG-signed Linux AppImage and checksum-bound DEB
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        env:
          APPIMAGETOOL_FORCE_SIGN: "1"
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.CMCLIENT_LINUX_SIGNING_PASSPHRASE }}
          NO_STRIP: "true"
          SIGN: "1"
          SIGN_KEY: ${{ vars.CMCLIENT_LINUX_SIGNING_KEY_ID }}
        run: |
          [[ -n "$APPIMAGETOOL_SIGN_PASSPHRASE" ]] || {
            echo "RELEASE_LINUX_SIGNING_PASSPHRASE_MISSING" >&2
            exit 1
          }
          pnpm --filter @cmclient/desktop exec tauri bundle \
            --ci \
            --verbose \
            --target "${{ matrix.rust_target }}" \
            --config "$CMCLIENT_PLATFORM_CONFIG"
      - name: Collect canonical platform-signed packages
        shell: bash
        run: |
          node scripts/desktop-native-bundles.mjs collect \
            --target "${{ matrix.target }}" \
            --version "${{ steps.identity.outputs.version }}" \
            --bundle-root "target/${{ matrix.rust_target }}/release/bundle" \
            --output release-signed
      - name: Verify Apple signature, notarization, and staple
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          stage="release-signed/native-desktop/${{ matrix.target }}"
          dmg="$(find "$stage" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          [[ -n "$dmg" ]] || { echo "RELEASE_APPLE_DMG_MISSING" >&2; exit 1; }
          mountpoint="$(mktemp -d)"
          trap 'hdiutil detach "$mountpoint" -force >/dev/null 2>&1 || true; rm -rf "$mountpoint"' EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" >/dev/null
          app="$(find "$mountpoint" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$app" ]] || { echo "RELEASE_APPLE_APP_MISSING" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$dmg"
      - name: Verify Windows Authenticode and timestamp
        if: startsWith(matrix.target, 'windows-')
        shell: powershell
        run: |
          $stage = "release-signed/native-desktop/${{ matrix.target }}"
          $packages = Get-ChildItem -LiteralPath $stage -File |
            Where-Object { $_.Extension -in @(".msi", ".exe") }
          if ($packages.Count -ne 2) { throw "RELEASE_WINDOWS_PACKAGE_SET_INVALID" }
          foreach ($package in $packages) {
            $signature = Get-AuthenticodeSignature -LiteralPath $package.FullName
            if ($signature.Status -ne "Valid" -or
                $null -eq $signature.TimeStamperCertificate -or
                $signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne
                  $env:CMCLIENT_WINDOWS_CERTIFICATE_THUMBPRINT.ToUpperInvariant()) {
              throw "RELEASE_WINDOWS_AUTHENTICODE_INVALID"
            }
          }
      - name: Verify embedded Linux AppImage signature
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          stage="release-signed/native-desktop/${{ matrix.target }}"
          appimage="$(find "$stage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          [[ -n "$appimage" ]] || { echo "RELEASE_LINUX_APPIMAGE_MISSING" >&2; exit 1; }
          chmod 755 "$appimage"
          bash scripts/install-appimage-validator.sh \
            "$RUNNER_TEMP/cmclient-appimage-tools"
          "$RUNNER_TEMP/cmclient-appimage-tools/validate" "$appimage"
      - name: Reinspect signed native package resources
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        shell: bash
        run: |
          bash scripts/desktop-native-smoke.sh \
            "release-signed/native-desktop/${{ matrix.target }}" \
            "${{ matrix.target }}" \
            "${{ steps.identity.outputs.version }}"
      - name: Reinspect signed Windows package resources
        if: startsWith(matrix.target, 'windows-')
        shell: powershell
        run: |
          & "$PWD/scripts/desktop-native-smoke.ps1" `
            -Stage "release-signed/native-desktop/${{ matrix.target }}" `
            -Target "${{ matrix.target }}" `
            -Version "${{ steps.identity.outputs.version }}"
      - name: Create canonical platform-signing receipt
        shell: bash
        run: |
          node scripts/release-supply-chain.mjs platform-receipt \
            --input "release-signed/native-desktop/${{ matrix.target }}" \
            --output "release-signed/platform-signing/cmclient-platform-signing-${{ matrix.target }}-${{ steps.identity.outputs.version }}.json" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.identity.outputs.version }}" \
            --source-sha "$GITHUB_SHA" \
            --identity-reference "${{ steps.identity.outputs.identity_reference }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-platform-signed-${{ matrix.target }}-${{ steps.identity.outputs.version }}
          path: release-signed/
          if-no-files-found: error
      - name: Remove temporary Apple signing material
        if: always() && startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          if [[ -n "${CMCLIENT_APPLE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CMCLIENT_APPLE_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/cmclient-apple-certificate.p12" \
            "$RUNNER_TEMP/AuthKey_$CMCLIENT_APPLE_API_KEY_ID.p8"
      - name: Remove imported Windows certificate
        if: always() && startsWith(matrix.target, 'windows-')
        shell: powershell
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CMCLIENT_IMPORTED_CERT_THUMBPRINT)) {
            Remove-Item `
              "Cert:\CurrentUser\My\$env:CMCLIENT_IMPORTED_CERT_THUMBPRINT" `
              -Force `
              -ErrorAction SilentlyContinue
          }
          Remove-Item `
            (Join-Path $env:RUNNER_TEMP "cmclient-signing.pfx") `
            -Force `
            -ErrorAction SilentlyContinue
      - name: Remove temporary Linux signing keyring
        if: always() && startsWith(matrix.target, 'linux-')
        shell: bash
        run: rm -rf "$RUNNER_TEMP/cmclient-gnupg"

  finalize-platform-signed:
    name: Re-finalize platform-signed supply chain
    needs: [supply-chain, final-windows-service-smoke, platform-sign-native]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Verify the exact immutable release tag
        id: identity
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || {
            echo "RELEASE_TAG_VERSION_MISMATCH" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-supply-chain-unsigned-*
          path: release-dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-platform-signed-*
          path: release-signed
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-build-*
          path: release-build
          merge-multiple: true
      - name: Install checksum-pinned SBOM tool
        shell: bash
        run: bash scripts/install-sbom-tool.sh "$RUNNER_TEMP/cmclient-sbom-tools"
      - name: Generate platform-signed composition SBOM
        shell: bash
        run: |
          rm -rf release-build/native-desktop release-build/platform-signing
          cp -R release-signed/native-desktop release-build/native-desktop
          cp -R release-signed/platform-signing release-build/platform-signing
          "$RUNNER_TEMP/cmclient-sbom-tools/syft" scan dir:release-build \
            --output "spdx-json=$RUNNER_TEMP/cmclient-platform-signed.spdx.json"
      - name: Replace signed bytes and regenerate release metadata
        shell: bash
        run: |
          version="${{ steps.identity.outputs.version }}"
          node scripts/release-supply-chain.mjs finalize-platform-signed \
            --input release-signed \
            --output release-dist \
            --sbom "$RUNNER_TEMP/cmclient-platform-signed.spdx.json" \
            --source-sha "$GITHUB_SHA" \
            --version "$version"
          node scripts/release-supply-chain.mjs verify \
            --output release-dist \
            --require-platform-signing \
            --source-sha "$GITHUB_SHA" \
            --version "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-supply-chain-platform-signed-${{ steps.identity.outputs.version }}
          path: release-dist/
          if-no-files-found: error

  attest:
    name: Sign finalized checksums and publish provenance
    needs: [finalize-platform-signed]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-supply-chain-platform-signed-*
          path: release-dist
          merge-multiple: true
      - name: Verify the exact immutable release tag and finalized input
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || {
            echo "RELEASE_TAG_VERSION_MISMATCH" >&2
            exit 1
          }
          node scripts/release-supply-chain.mjs verify \
            --output release-dist \
            --require-platform-signing \
            --source-sha "$GITHUB_SHA" \
            --version "$version"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Create keyless checksum signature bundle
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle release-dist/SHA256SUMS.sigstore.json \
            release-dist/SHA256SUMS
      - name: Attest archive and SBOM checksums
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: release-dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-supply-chain-attested
          path: release-dist/
          if-no-files-found: error

  sign-update-manifest:
    name: Sign unified CMClient update manifest
    needs: [attest]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest &&
      inputs.release_base_url != '' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cmclient-supply-chain-attested
          path: release-dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Verify immutable tag, release input, and attestation before exposing the signing key
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || {
            echo "RELEASE_TAG_VERSION_MISMATCH" >&2
            exit 1
          }
          node scripts/release-supply-chain.mjs verify \
            --output release-dist \
            --require-platform-signing \
            --source-sha "$GITHUB_SHA" \
            --version "$version"
          cosign verify-blob \
            --bundle release-dist/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-build.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-dist/SHA256SUMS
      - name: Sign canonical unified CMClient manifest without exposing the private key
        shell: bash
        env:
          CMCLIENT_UPDATE_SIGNING_KEY: ${{ secrets.CMCLIENT_UPDATE_SIGNING_KEY }}
          RELEASE_BASE_URL: ${{ inputs.release_base_url }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_MINIMUM_AGENT_VERSION: ${{ inputs.minimum_agent_version }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.CMCLIENT_UPDATE_SIGNING_KEY_ID }}
        run: |
          [[ -n "$CMCLIENT_UPDATE_SIGNING_KEY" ]] || {
            echo "RELEASE_SIGNING_KEY_MISSING" >&2
            exit 1
          }
          [[ -n "$RELEASE_SIGNING_KEY_ID" ]] || {
            echo "RELEASE_SIGNING_KEY_ID_MISSING" >&2
            exit 1
          }
          published_at="$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)"
          node scripts/release-supply-chain.mjs sign-update-manifest \
            --index release-dist/release-index.json \
            --output release-dist/update-manifest.json \
            --channel "$RELEASE_CHANNEL" \
            --minimum-agent-version "$RELEASE_MINIMUM_AGENT_VERSION" \
            --published-at "$published_at" \
            --release-base-url "$RELEASE_BASE_URL" \
            --signing-key-id "$RELEASE_SIGNING_KEY_ID" \
            --private-key-env CMCLIENT_UPDATE_SIGNING_KEY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmclient-signed-update-manifest
          path: release-dist/update-manifest.json
          if-no-files-found: error
