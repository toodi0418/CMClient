services:
  gateway:
    image: "${CMCLIENT_IMAGE:-cmclient:local}"
    build:
      context: .
      dockerfile: Dockerfile
    command: ["gateway"]
    init: true
    restart: unless-stopped
    environment:
      CMCLIENT_DEPLOYMENT_MODE: docker
      CMCLIENT_GATEWAY_HOST: 0.0.0.0
      CMCLIENT_GATEWAY_PORT: "8081"
      CMCLIENT_DATA_DIR: /var/lib/cmclient
    volumes:
      - cmclient-data:/var/lib/cmclient
    expose:
      - "8081"
    networks:
      - cmclient-internal
      - cmclient-egress
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/api/v1/system/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    image: "${CMCLIENT_IMAGE:-cmclient:local}"
    command: ["web"]
    init: true
    restart: unless-stopped
    environment:
      CMCLIENT_WEB_PORT: "8080"
      CMCLIENT_WEB_UPSTREAM: http://gateway:8081
    depends_on:
      gateway:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - cmclient-internal
      - cmclient-web
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  ingress:
    image: "${CMCLIENT_IMAGE:-cmclient:local}"
    command: ["ingress"]
    init: true
    restart: unless-stopped
    environment:
      CMCLIENT_INGRESS_PORT: "8080"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CMCLIENT_WEB_PORT:-8080}:8080"
    networks:
      - cmclient-web
      - cmclient-ingress
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  cmclient-data:

networks:
  cmclient-internal:
    internal: true
  cmclient-web:
    internal: true
  cmclient-ingress:
  cmclient-egress:
