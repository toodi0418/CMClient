[package]
name = "cmclient-legacy-migration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cmclient-migrate"
path = "src/main.rs"

[dependencies]
atomic-write-file.workspace = true
clap = { version = "4.5", features = ["derive"] }
cmclient-agent-core = { path = "../agent-core" }
cmclient-runtime-primitives = { path = "../runtime-primitives" }
process-wrap = { version = "9.1.0", default-features = false, features = ["std", "job-object", "process-group"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file.workspace = true
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[lints]
workspace = true
