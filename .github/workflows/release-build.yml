name: Release Build Matrix

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      attest:
        description: Generate keyless Cosign and GitHub provenance attestations
        required: false
        default: false
        type: boolean
      channel:
        description: Update channel for an explicitly signed manifest
        required: false
        default: dev
        type: choice
        options: [stable, beta, dev]
      minimum_agent_version:
        description: Minimum Agent SemVer for an explicitly signed manifest
        required: false
        default: 2.0.0
        type: string
      release_base_url:
        description: Immutable HTTPS directory containing the finalized archives
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-plan:
    name: Verify artifact plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate canonical artifact plan
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-artifacts.mjs plan --version "$version" --output release-build/artifact-plan.json
          node scripts/release-artifacts.mjs check-plan --input release-build/artifact-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: cmclient-release-artifact-plan
          path: release-build/artifact-plan.json
          if-no-files-found: error

  build:
    name: ${{ matrix.component }} ${{ matrix.target }}
    needs: artifact-plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: desktop
            target: darwin-aarch64
            os: macos-14
            rust_target: aarch64-apple-darwin
            package: cmclient-desktop
            binary: cmclient-desktop
          - component: headless
            target: darwin-aarch64
            os: macos-14
            rust_target: aarch64-apple-darwin
            package: cmclient-agent
            binary: cmclient-agent
          - component: cli
            target: darwin-aarch64
            os: macos-14
            rust_target: aarch64-apple-darwin
            package: cmclient-cli
            binary: cmclient
          - component: desktop
            target: darwin-x86_64
            os: macos-13
            rust_target: x86_64-apple-darwin
            package: cmclient-desktop
            binary: cmclient-desktop
          - component: headless
            target: darwin-x86_64
            os: macos-13
            rust_target: x86_64-apple-darwin
            package: cmclient-agent
            binary: cmclient-agent
          - component: cli
            target: darwin-x86_64
            os: macos-13
            rust_target: x86_64-apple-darwin
            package: cmclient-cli
            binary: cmclient
          - component: desktop
            target: linux-aarch64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            package: cmclient-desktop
            binary: cmclient-desktop
          - component: headless
            target: linux-aarch64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            package: cmclient-agent
            binary: cmclient-agent
          - component: cli
            target: linux-aarch64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            package: cmclient-cli
            binary: cmclient
          - component: desktop
            target: linux-x86_64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            package: cmclient-desktop
            binary: cmclient-desktop
          - component: headless
            target: linux-x86_64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            package: cmclient-agent
            binary: cmclient-agent
          - component: cli
            target: linux-x86_64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            package: cmclient-cli
            binary: cmclient
          - component: desktop
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            package: cmclient-desktop
            binary: cmclient-desktop.exe
          - component: headless
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            package: cmclient-agent
            binary: cmclient-agent.exe
          - component: cli
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            package: cmclient-cli
            binary: cmclient.exe
          - component: service
            target: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            package: cmclient-service-host
            binary: cmclient-service-host.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install Linux desktop and secret-store dependencies
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - name: Install exact Rust target
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"
      - run: pnpm install --frozen-lockfile
      - name: Build frontend inputs
        shell: bash
        run: |
          pnpm --filter @cmclient/contracts run build
          if [ "${{ matrix.component }}" = "desktop" ]; then
            pnpm --filter @cmclient/desktop run build
          fi
          if [ "${{ matrix.component }}" = "headless" ]; then
            pnpm --filter @cmclient/gateway run build
            pnpm --filter @cmclient/web run build
          fi
      - name: Build ${{ matrix.component }} executable
        shell: bash
        run: |
          cargo build --release --locked \
            --package "${{ matrix.package }}" \
            --target "${{ matrix.rust_target }}"
      - name: Stage build with canonical release metadata
        id: stage
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-artifacts.mjs stage \
            --component "${{ matrix.component }}" \
            --target "${{ matrix.target }}" \
            --version "$version" \
            --binary "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" \
            --output release-build
          echo "artifact=cmclient-build-${{ matrix.component }}-${{ matrix.target }}-$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: release-build/
          if-no-files-found: error

  supply-chain:
    name: Assemble archives, checksums, and SBOM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: cmclient-build-*
          path: release-build
          merge-multiple: true
      - name: Install deterministic archive tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes zip zstd
      - name: Assemble canonical release archives
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-supply-chain.mjs assemble \
            --input release-build \
            --output release-dist \
            --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release-dist/cmclient-${{ steps.release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Finalize and verify supply-chain metadata
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          node scripts/release-supply-chain.mjs finalize --output release-dist
          node scripts/release-supply-chain.mjs verify \
            --output release-dist \
            --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: cmclient-supply-chain-unsigned-${{ steps.release.outputs.version }}
          path: release-dist/
          if-no-files-found: error

  attest:
    name: Sign checksums and publish provenance
    needs: supply-chain
    if: github.event_name == 'workflow_dispatch' && inputs.attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cmclient-supply-chain-unsigned-*
          path: release-dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@b4da77ecad80ff9afe572690e3ce4a55a58e629c # v3.9.1
        with:
          cosign-release: v2.5.2
      - name: Create keyless checksum signature bundle
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle release-dist/SHA256SUMS.sigstore.json \
            release-dist/SHA256SUMS
      - name: Attest archive and SBOM checksums
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-checksums: release-dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cmclient-supply-chain-attested
          path: release-dist/
          if-no-files-found: error

  sign-update-manifest:
    name: Sign Agent update manifest
    needs: supply-chain
    if: github.event_name == 'workflow_dispatch' && inputs.release_base_url != '' && secrets.CMCLIENT_UPDATE_SIGNING_KEY != '' && vars.CMCLIENT_UPDATE_SIGNING_KEY_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cmclient-supply-chain-unsigned-*
          path: release-dist
          merge-multiple: true
      - name: Sign canonical Agent manifest without exposing the private key
        shell: bash
        env:
          CMCLIENT_UPDATE_SIGNING_KEY: ${{ secrets.CMCLIENT_UPDATE_SIGNING_KEY }}
          RELEASE_BASE_URL: ${{ inputs.release_base_url }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_MINIMUM_AGENT_VERSION: ${{ inputs.minimum_agent_version }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.CMCLIENT_UPDATE_SIGNING_KEY_ID }}
        run: |
          published_at="$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)"
          node scripts/release-supply-chain.mjs sign-update-manifest \
            --index release-dist/release-index.json \
            --output release-dist/update-manifest.json \
            --channel "$RELEASE_CHANNEL" \
            --minimum-agent-version "$RELEASE_MINIMUM_AGENT_VERSION" \
            --published-at "$published_at" \
            --release-base-url "$RELEASE_BASE_URL" \
            --signing-key-id "$RELEASE_SIGNING_KEY_ID" \
            --private-key-env CMCLIENT_UPDATE_SIGNING_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: cmclient-signed-update-manifest
          path: release-dist/update-manifest.json
          if-no-files-found: error
