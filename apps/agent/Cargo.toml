[package]
name = "cmclient-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
atomic-write-file.workspace = true
axum.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cmclient-agent-core = { path = "../../crates/agent-core" }
cmclient-control-api = { path = "../../crates/control-api" }
cmclient-legacy-migration = { path = "../../crates/legacy-migration" }
cmclient-runtime-logging = { path = "../../crates/runtime-logging" }
cmclient-supervisor = { path = "../../crates/supervisor" }
cmclient-updater = { path = "../../crates/updater" }
ctrlc = { version = "3.5", features = ["termination"] }
futures-util = { version = "=0.3.33", default-features = false, features = ["async-await", "sink"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = "1"
serde_json = "1"
tokio.workspace = true
tokio-stream = { version = "=0.1.18", features = ["sync"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zeroize = "1.8"

[dev-dependencies]
cmclient-agent-core = { path = "../../crates/agent-core", features = ["test-support"] }
http-body-util.workspace = true
tower.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "=0.35.2", default-features = false, features = ["system"] }
tao = { version = "=0.35.3", default-features = false }
tray-icon = { version = "=0.24.1", default-features = false }

[lints]
workspace = true
