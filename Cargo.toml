[workspace]
members = [
  "apps/agent",
  "apps/cli",
  "apps/desktop/src-tauri",
  "apps/service-host",
  "crates/agent-core",
  "crates/cli-client",
  "crates/control-api",
  "crates/legacy-migration",
  "crates/runtime-logging",
  "crates/supervisor",
  "crates/updater"
]
resolver = "2"

[workspace.package]
version = "2.0.0-rc.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
