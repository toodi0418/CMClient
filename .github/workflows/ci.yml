name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            zstd
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:web
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo build --workspace --locked

  desktop-smoke:
    name: Desktop smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            install_tauri_dependencies: true
          - name: macOS
            os: macos-latest
            install_tauri_dependencies: false
          - name: Windows
            os: windows-latest
            install_tauri_dependencies: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Install Tauri system dependencies
        if: matrix.install_tauri_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cmclient/desktop run build
      - run: cargo test -p cmclient-desktop --locked
      - run: cargo build -p cmclient-desktop --locked

  windows-service-smoke:
    name: Windows service and control-pipe smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo test -p cmclient-control-api --locked
      - run: cargo test -p cmclient-service-host --locked
      - run: cargo build -p cmclient-service-host --locked
      - run: cargo build -p cmclient-agent --locked
      - name: Render Windows service registration without creating it
        shell: powershell
        run: |
          $rendered = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cmclient-windows-service.ps1 render -HostPath 'C:\Program Files\CMClient\current\bin\cmclient-service-host.exe' | ConvertFrom-Json
          if ($rendered.serviceName -ne 'CMClientAgent' -or $rendered.storesCredentials) { throw 'Windows service render failed' }
      - name: Exercise isolated Windows Service install, upgrade, and uninstall
        shell: powershell
        run: |
          $root = Join-Path $env:TEMP "cmclient-packaging-$env:GITHUB_RUN_ID"
          $serviceName = "CMClientAgentPackage$env:GITHUB_RUN_ID"
          $hostV1 = Join-Path $root "v1\cmclient-service-host.exe"
          $hostV2 = Join-Path $root "v2\cmclient-service-host.exe"
          $state = Join-Path $root "data\retained-state"
          $manager = Join-Path $PWD "scripts\cmclient-windows-service.ps1"
          New-Item -ItemType Directory -Force (Split-Path $hostV1), (Split-Path $hostV2), (Split-Path $state) | Out-Null
          Copy-Item (Join-Path $PWD "target\debug\cmclient-service-host.exe") $hostV1
          Copy-Item $hostV1 $hostV2
          Set-Content -NoNewline $state "must survive service lifecycle"
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File $manager install -HostPath $hostV1 -ServiceName $serviceName -NoStart
            if ((Get-Service -Name $serviceName).Status -ne "Stopped") { throw "Windows service should not start in lifecycle smoke" }
            powershell -NoProfile -ExecutionPolicy Bypass -File $manager install -HostPath $hostV2 -ServiceName $serviceName -NoStart
            $configuration = sc.exe qc $serviceName | Out-String
            if ($configuration -notmatch [regex]::Escape($hostV2)) { throw "Windows service upgrade path was not applied" }
            powershell -NoProfile -ExecutionPolicy Bypass -File $manager uninstall -HostPath $hostV2 -ServiceName $serviceName
            for ($attempt = 0; $attempt -lt 10 -and (Get-Service -Name $serviceName -ErrorAction SilentlyContinue); $attempt++) { Start-Sleep -Milliseconds 250 }
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) { throw "Windows service was not removed" }
            if ((Get-Content -Raw $state) -ne "must survive service lifecycle") { throw "Windows service uninstall removed retained state" }
          }
          finally {
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              powershell -NoProfile -ExecutionPolicy Bypass -File $manager uninstall -HostPath $hostV2 -ServiceName $serviceName
            }
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          }

  docker-smoke:
    name: Docker restricted runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Build and start the restricted Docker deployment
        run: bash scripts/docker-smoke.sh
