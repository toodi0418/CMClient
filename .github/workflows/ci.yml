name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency, secret, and policy audit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit:policy
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level high
      - run: pnpm audit signatures
      - name: Install pinned security audit tools
        run: bash scripts/install-security-audit-tools.sh "$RUNNER_TEMP/cmclient-security-tools"
      - name: Validate GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/actionlint" .github/workflows/*.yml
      - name: Scan the repository for secrets
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/gitleaks" dir --redact --no-banner --no-color .
      - name: Audit Rust dependencies
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/cargo-audit" audit --deny unsound --ignore RUSTSEC-2024-0429

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          components: rustfmt
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            zstd
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:load
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:web
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo build --workspace --locked

  desktop-smoke:
    name: Desktop smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            install_tauri_dependencies: true
          - name: macOS
            os: macos-latest
            install_tauri_dependencies: false
          - name: Windows
            os: windows-latest
            install_tauri_dependencies: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          components: rustfmt
      - name: Install Tauri system dependencies
        if: matrix.install_tauri_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cmclient/desktop run build
      - run: cargo test -p cmclient-desktop --locked
      - run: cargo build -p cmclient-desktop --locked

  windows-service-smoke:
    name: Windows service and control-pipe smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - run: cargo test -p cmclient-agent-core --locked
      - run: cargo test -p cmclient-control-api --locked
      - run: cargo test -p cmclient-agent --locked
      - run: cargo test -p cmclient-cli --locked
      - run: cargo test -p cmclient-service-host --locked
      - run: cargo build -p cmclient-service-host --locked
      - name: Render Windows service registration without creating it
        shell: powershell
        run: |
          $rendered = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cmclient-windows-service.ps1 render -HostPath 'C:\Program Files\CMClient\current\bin\cmclient-service-host.exe' | ConvertFrom-Json
          if ($rendered.serviceName -ne 'CMClientAgent' -or $rendered.storesCredentials) { throw 'Windows service render failed' }
      - name: Exercise canonical Windows Service install, upgrade, start, and uninstall
        shell: powershell
        run: |
          $serviceName = "CMClientAgent"
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) { throw "WINDOWS_CANONICAL_SERVICE_NAME_IN_USE" }
          $runIdentity = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $root = Join-Path $env:ProgramData "CMClientPackageSmoke-$runIdentity"
          if (Test-Path -LiteralPath $root) { throw "WINDOWS_CI_PACKAGE_ROOT_EXISTS" }
          $hostV1 = Join-Path $root "v1\cmclient-service-host.exe"
          $hostV2 = Join-Path $root "v2\cmclient-service-host.exe"
          $agentV1 = Join-Path $root "v1\cmclient-agent.exe"
          $agentV2 = Join-Path $root "v2\cmclient-agent.exe"
          $cliPath = Join-Path $PWD "target\debug\cmclient.exe"
          $controlEndpoint = '\\.\pipe\cmclient-control'
          $programDataRoot = Join-Path $env:ProgramData "CMClient"
          $programDataBackup = "$programDataRoot.ci-backup-$runIdentity"
          $programDataMoved = $false
          $programDataIsolated = $false
          $configFile = Join-Path $programDataRoot "config\agent.toml"
          $state = Join-Path $programDataRoot "data\retained-state"
          $sentinel = "must survive service lifecycle"
          $manager = Join-Path $PWD "scripts\cmclient-windows-service.ps1"
          if (Test-Path -LiteralPath $programDataBackup) { throw "WINDOWS_CI_STATE_BACKUP_EXISTS" }
          try {
            if (Test-Path -LiteralPath $programDataRoot) {
              Move-Item -LiteralPath $programDataRoot -Destination $programDataBackup
              $programDataMoved = $true
            }
            $programDataIsolated = $true
            New-Item -ItemType Directory -Force (Split-Path $hostV1), (Split-Path $hostV2), (Split-Path $configFile), (Split-Path $state) | Out-Null
            Copy-Item (Join-Path $PWD "target\debug\cmclient-service-host.exe") $hostV1
            Copy-Item $hostV1 $hostV2
            Copy-Item (Join-Path $PWD "target\debug\cmclient-agent.exe") $agentV1
            Copy-Item $agentV1 $agentV2
            [IO.File]::WriteAllText($configFile, "[agent]`ngateway_port = 4811`nmanagement_web_enabled = false`n")
            [IO.File]::WriteAllText($state, $sentinel)
            & icacls.exe $root /grant '*S-1-5-19:(OI)(CI)RX' /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "WINDOWS_CI_PACKAGE_ACL_FAILED" }
            & icacls.exe $programDataRoot /grant '*S-1-5-19:(OI)(CI)F' /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "WINDOWS_CI_STATE_ACL_FAILED" }
            if (-not (Test-Path -LiteralPath $state -PathType Leaf) -or [IO.File]::ReadAllText($state) -ne $sentinel) { throw "Windows lifecycle retained-state fixture was not created" }

            powershell -NoProfile -ExecutionPolicy Bypass -File $manager install -HostPath $hostV1 -NoStart
            if ((Get-Service -Name $serviceName).Status -ne "Stopped") { throw "Windows service should not start in lifecycle smoke" }
            powershell -NoProfile -ExecutionPolicy Bypass -File $manager install -HostPath $hostV2 -NoStart
            $configuration = sc.exe qc $serviceName | Out-String
            if ($configuration -notmatch [regex]::Escape($hostV2)) { throw "Windows service upgrade path was not applied" }

            Start-Service -Name $serviceName
            $controlStatus = $null
            for ($attempt = 0; $attempt -lt 60 -and $null -eq $controlStatus; $attempt++) {
              $statusJson = & $cliPath --json --endpoint $controlEndpoint status 2>$null
              if ($LASTEXITCODE -eq 0) {
                try {
                  $candidate = $statusJson | ConvertFrom-Json
                  if ($candidate.agent -eq "running" -and $candidate.management_web -eq "disabled") { $controlStatus = $candidate }
                }
                catch {}
              }
              if ($null -eq $controlStatus) { Start-Sleep -Milliseconds 500 }
            }
            if ($null -eq $controlStatus -or $controlStatus.agent -ne "running") { throw "WINDOWS_CANONICAL_SERVICE_CONTROL_PIPE_FAILED" }
            if ((Get-Service -Name $serviceName).Status -ne "Running") { throw "WINDOWS_CANONICAL_SERVICE_NOT_RUNNING" }
            $agent = Get-CimInstance Win32_Process -Filter "Name = 'cmclient-agent.exe'" |
              Where-Object { $_.ExecutablePath -eq $agentV2 } |
              Select-Object -First 1
            if ($null -eq $agent -or $agent.ExecutablePath -ne $agentV2) { throw "WINDOWS_CANONICAL_SERVICE_ADJACENT_AGENT_INVALID" }

            powershell -NoProfile -ExecutionPolicy Bypass -File $manager uninstall -HostPath $hostV2
            for ($attempt = 0; $attempt -lt 10 -and (Get-Service -Name $serviceName -ErrorAction SilentlyContinue); $attempt++) { Start-Sleep -Milliseconds 250 }
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) { throw "Windows service was not removed" }
            if (-not (Test-Path -LiteralPath $state -PathType Leaf) -or [IO.File]::ReadAllText($state) -ne $sentinel) { throw "Windows service uninstall removed retained state" }
          }
          finally {
            if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
              powershell -NoProfile -ExecutionPolicy Bypass -File $manager uninstall -HostPath $hostV2
            }
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            if ($programDataIsolated) {
              Remove-Item -Recurse -Force $programDataRoot -ErrorAction SilentlyContinue
              if ($programDataMoved) { Move-Item -LiteralPath $programDataBackup -Destination $programDataRoot }
            }
          }

  linux-systemd-smoke:
    name: Linux systemd 249 service and control-socket smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - name: Install Linux Agent build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev
      - name: Build the service Agent and control CLI
        run: cargo build -p cmclient-agent -p cmclient-cli --locked
      - name: Exercise systemd LoadCredential and the dedicated Control socket
        run: |
          sudo env \
            CI=true \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            CMCLIENT_SMOKE_SERVICE_USER="$USER" \
            bash scripts/cmclient-systemd-integration.sh \
              target/debug/cmclient-agent \
              target/debug/cmclient

  docker-smoke:
    name: Docker restricted runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build and start the restricted Docker deployment
        run: bash scripts/docker-smoke.sh
