name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency, secret, and policy audit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit:policy
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level high
      - run: pnpm audit signatures
      - name: Install pinned security audit tools
        run: bash scripts/install-security-audit-tools.sh "$RUNNER_TEMP/cmclient-security-tools"
      - name: Validate GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/actionlint" .github/workflows/*.yml
      - name: Scan the repository for secrets
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/gitleaks" dir --redact --no-banner --no-color .
      - name: Audit Rust dependencies
        run: |
          "$RUNNER_TEMP/cmclient-security-tools/cargo-audit" audit --deny unsound --ignore RUSTSEC-2024-0429

  rust-msrv:
    name: Rust MSRV 1.87
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c4743642b206695ff6aa863032b1037759ee95ea # 1.87.0
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - run: cargo check --workspace --all-targets --locked

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          components: rustfmt
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            python3 \
            zstd
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:load
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:web
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked

  windows-source-build:
    name: Windows direct source build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - run: pnpm install --frozen-lockfile
      - name: Build canonical Windows source targets
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cmclient-source-target
        run: pnpm build:source:windows
      - name: Stage exact private Node
        id: private-node
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & node scripts/private-node-runtime.mjs validate-manifest
          if ($LASTEXITCODE -ne 0) {
            throw 'Private Node manifest validation failed'
          }

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'packaging/runtime/private-node-runtime.json'
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $targets = @($manifest.targets | Where-Object { $_.target -eq 'windows-x86_64' })
          if ($targets.Count -ne 1) {
            throw 'Private Node manifest must contain exactly one Windows x86-64 target'
          }
          $target = $targets[0]
          $campaignRoot = Join-Path $env:RUNNER_TEMP 'cmclient-private-node'
          $archivePath = Join-Path $campaignRoot ([string]$target.archiveFileName)
          $stageRoot = Join-Path $campaignRoot 'stage'
          New-Item -ItemType Directory -Force -Path $campaignRoot | Out-Null
          Invoke-WebRequest -Uri ([string]$target.archiveUrl) -OutFile $archivePath

          $stageOutput = & node scripts/private-node-runtime.mjs stage-windows `
            --archive $archivePath `
            --campaign-root $campaignRoot `
            --stage-root $stageRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Private Node staging failed'
          }
          $stage = $stageOutput | ConvertFrom-Json
          $executable = [System.IO.Path]::GetFullPath([string]$stage.executable)
          if (-not [System.IO.Path]::IsPathFullyQualified($executable) -or
              -not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw 'Private Node staging did not return an absolute executable'
          }
          "executable=$executable" >> $env:GITHUB_OUTPUT
      - name: Test the real Agent to Gateway private session
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cmclient-source-target
          CMCLIENT_PRIVATE_NODE: ${{ steps.private-node.outputs.executable }}
        run: cargo test --locked --target x86_64-pc-windows-msvc -p cmclient-agent tests::supervised_real_gateway_uses_private_dynamic_session -- --ignored --exact
      - name: Test the staged private Node source runtime
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cmclient-source-target
          CMCLIENT_PRIVATE_NODE: ${{ steps.private-node.outputs.executable }}
          CMCLIENT_CAMPAIGN_ROOT: ${{ runner.temp }}/cmclient-private-node/campaign
        run: cargo test --locked --target x86_64-pc-windows-msvc -p cmclient-agent --test windows_source_runtime production_agent_uses_staged_private_node_control_and_web -- --ignored --exact --nocapture

  desktop-smoke:
    name: Desktop smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            install_tauri_dependencies: true
            updater_bundle: appimage
          - name: macOS
            os: macos-latest
            install_tauri_dependencies: false
            updater_bundle: app
          - name: Windows
            os: windows-latest
            install_tauri_dependencies: false
            updater_bundle: nsis
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          components: rustfmt
      - name: Install Tauri system dependencies
        if: matrix.install_tauri_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - name: Verify updater fixture contract
        run: node scripts/p13-updater-driver-fixture.mjs verify
      - name: Test updater fixture Rust helper
        shell: bash
        env:
          CMCLIENT_CAMPAIGN_ROOT: ${{ runner.temp }}/cmclient-p13-fixture
        run: node scripts/p13-updater-driver-fixture.mjs cargo-test
      - name: Probe hidden updater AppHandle on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          CMCLIENT_CAMPAIGN_ROOT: ${{ runner.temp }}/cmclient-p13-fixture
        run: xvfb-run -a node scripts/p13-updater-driver-fixture.mjs probe
      - name: Probe hidden updater AppHandle
        if: runner.os != 'Linux'
        shell: bash
        env:
          CMCLIENT_CAMPAIGN_ROOT: ${{ runner.temp }}/cmclient-p13-fixture
        run: node scripts/p13-updater-driver-fixture.mjs probe
      - name: Build target-native updater fixture
        shell: bash
        env:
          CMCLIENT_CAMPAIGN_ROOT: ${{ runner.temp }}/cmclient-p13-fixture
          CMCLIENT_P13_FIXTURE_VERSION: 0.1.0
        run: node scripts/p13-updater-driver-fixture.mjs build ${{ matrix.updater_bundle }}
      - run: pnpm --filter @cmclient/desktop run build
      - run: cargo test -p cmclient-desktop --locked
      - run: cargo build -p cmclient-desktop --locked

  windows-service-smoke:
    name: Windows transitional service-host contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - run: cargo test -p cmclient-agent-core --locked
      - run: cargo test -p cmclient-control-api --locked
      - run: cargo test -p cmclient-agent --locked
      - run: cargo test -p cmclient-cli --locked
      - run: cargo test -p cmclient-service-host --locked
      - run: cargo build -p cmclient-agent -p cmclient-cli -p cmclient-service-host --locked
      - name: Render Windows service registration without creating it
        shell: powershell
        run: |
          $rendered = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/cmclient-windows-service.ps1 render -HostPath 'C:\Program Files\CMClient\current\bin\cmclient-service-host.exe' | ConvertFrom-Json
          if ($rendered.serviceName -ne 'CMClientAgent' -or $rendered.storesCredentials) { throw 'Windows service render failed' }

  linux-systemd-smoke:
    name: Linux systemd 249 service and control-socket smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - name: Install Linux Agent build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev
      - name: Build the service Agent and control CLI
        run: cargo build -p cmclient-agent -p cmclient-cli --locked
      - name: Exercise canonical plaintext runtime and the dedicated Control socket
        run: |
          sudo env \
            CI=true \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            CMCLIENT_SMOKE_SERVICE_USER="$USER" \
            bash scripts/cmclient-systemd-integration.sh \
              target/debug/cmclient-agent \
              target/debug/cmclient

  docker-smoke:
    name: Docker restricted runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build and start the restricted Docker deployment
        run: bash scripts/docker-smoke.sh
